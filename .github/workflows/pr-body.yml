name: PR body

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, labeled, unlabeled]

permissions:
  contents: read

# The body is the evidence the gate reads: what changed, proof that it works before and after,
# how hard it is to undo, and the issue it closes. The `no-evidence` label exempts a PR.
jobs:
  pr-body:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            if (pr.labels.some((label) => label.name === "no-evidence")) {
              core.notice("Exempt: this PR is labelled no-evidence.");
              return;
            }

            // Comments are the template's hints, so an unfilled template has nothing left.
            const body = (pr.body ?? "").replace(/\r\n/g, "\n").replace(/<!--[\s\S]*?-->/g, "");
            const sections = new Map();
            for (const part of body.split(/^## /m).slice(1)) {
              const newline = part.indexOf("\n");
              const heading = (newline === -1 ? part : part.slice(0, newline)).trim();
              const text = newline === -1 ? "" : part.slice(newline + 1).trim();
              sections.set(heading.toLowerCase(), text);
            }

            const problems = [];
            const section = (name) => {
              const text = sections.get(name.toLowerCase());
              if (text === undefined) problems.push(`Missing the "## ${name}" section.`);
              else if (text === "") problems.push(`The "## ${name}" section is empty.`);
              return text ?? "";
            };

            section("Summary");
            const evidence = section("Evidence");
            const proof = evidence.replace(/\*\*\s*(before|after)\s*:?\s*\*\*:?/gi, "").replace(/[\s*>-]/g, "");
            if (evidence !== "" && !(/\bbefore\b/i.test(evidence) && /\bafter\b/i.test(evidence) && proof !== "")) {
              problems.push('"## Evidence" needs a Before and an After, with the proof itself.');
            }
            const danger = section("Merge Danger");
            if (danger !== "" && !/\*\*Door:\*\*\s*(one|two)-way/i.test(danger)) {
              problems.push('"## Merge Danger" needs "**Door:** one-way" or "**Door:** two-way".');
            }
            if (!/\b(close[sd]?|fix(e[sd])?|resolve[sd]?) #\d+/i.test(body)) {
              problems.push('The body needs "Closes #<issue>".');
            }

            if (problems.length > 0) {
              core.setFailed(`${problems.join("\n")}\nSee .github/pull_request_template.md, or label the PR no-evidence if it is exempt.`);
            }
