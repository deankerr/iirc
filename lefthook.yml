# Formatting is never an agent's job: a commit fixes and re-stages its own files, and never
# fails on what is left. A push runs the full checks, and CI runs them again on the PR.
pre-commit:
  jobs:
    - name: fix
      run: bun run fix {staged_files} || true
      glob:
        - "*.ts"
        - "*.tsx"
        - "*.json"
        - "*.jsonc"
        - "*.css"
        - "*.html"
        - "*.md"
        - "*.yaml"
        - "*.yml"
      stage_fixed: true

pre-push:
  parallel: true
  jobs:
    - name: check
      run: bun run check
    - name: knip
      run: bun run knip
    - name: test
      run: bun run test
