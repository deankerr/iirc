# Runs the soak Daemon from the pinned copy of the binary, which only `docs/soak.md`'s
# upgrade steps replace, so that building iirc for day-to-day work never changes what the
# soak test is testing. Install it as
# ~/.config/systemd/user/iirc@soak-<a|b>.service.d/pinned.conf, then
# `systemctl --user daemon-reload`.

[Service]
# The empty line clears the template's ExecStart, which a drop-in otherwise adds to.
ExecStart=
ExecStart=%h/.local/opt/iirc/soak/iirc daemon
